<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Java Real-Time Chat</title><style>
:root{font-family:system-ui,sans-serif;color:#17243a;background:#eef2f7}*{box-sizing:border-box}main{max-width:760px;margin:3rem auto;background:white;border-radius:16px;padding:24px;box-shadow:0 12px 40px #1730521a}
h1{margin:0 0 4px}.muted{color:#64748b}label{display:block;font-weight:600;margin:12px 0 4px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bac6d3}input{width:100%}button{cursor:pointer;background:#2258b9;color:white;border:0}.fields{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.fields label{margin:0}.fields button{min-height:46px}#messages{list-style:none;min-height:260px;max-height:420px;overflow:auto;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}#messages li{padding:8px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}.composer{display:flex;gap:8px}.composer input{flex:1}#status{font-weight:600}small{color:#64748b}@media(max-width:580px){main{margin:10px;padding:15px}.fields{grid-template-columns:1fr}.composer{flex-direction:column}}
</style></head><body><main><h1>Java Real-Time Chat</h1><p class="muted">Spring Boot · STOMP WebSockets · In-memory demo</p>
<div class="fields"><label>Your name<input id="name" maxlength="30" value="Guest" autocomplete="off"></label><label>Room<input id="room" maxlength="24" value="general" autocomplete="off"></label><button id="join">Join room</button></div>
<p id="status" role="status">Not connected</p><ol id="messages" aria-live="polite"></ol>
<form id="sendForm" class="composer"><input id="message" maxlength="500" placeholder="Type a message..." autocomplete="off" required><button id="send" disabled>Send</button></form>
<p><small>Demo only: no accounts or private messages. Do not share personal information.</small></p></main>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);let client=null;let subscription=null;let activeRoom=null;
function add(message){const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=message.sender+': ';li.appendChild(strong);li.appendChild(document.createTextNode(message.text));$('messages').appendChild(li);$('messages').scrollTop=$('messages').scrollHeight;}
function status(text){$('status').textContent=text;}
$('join').onclick=async()=>{
 const name=$('name').value.trim(),room=$('room').value.trim().toLowerCase();
 if(!name||name.length>30||!/^[a-z0-9_-]{1,24}$/.test(room)){status('Enter a name and a room (letters, numbers, _ or -).');return;}
 if(client){await client.deactivate();client=null;}activeRoom=room;$('messages').replaceChildren();$('send').disabled=true;status('Connecting...');
 try {const response=await fetch('/api/rooms/'+encodeURIComponent(room)+'/messages');if(response.ok){const messages=await response.json();messages.forEach(add);}}catch(e){status('History unavailable; trying chat connection.');}
 client=new StompJs.Client({brokerURL:(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws',reconnectDelay:3000,onConnect:()=>{subscription=client.subscribe('/topic/rooms/'+room,frame=>add(JSON.parse(frame.body)));$('send').disabled=false;status('Connected to #'+room);},onWebSocketClose:()=>{$('send').disabled=true;status('Disconnected; reconnecting...');},onStompError:()=>status('Connection error')});client.activate();
};
$('sendForm').onsubmit=e=>{e.preventDefault();if(!client?.connected||!activeRoom)return;const text=$('message').value.trim(),sender=$('name').value.trim();if(!text||!sender)return;client.publish({destination:'/app/chat.send',body:JSON.stringify({room:activeRoom,sender,text})});$('message').value='';};
</script></body></html>
